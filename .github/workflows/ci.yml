name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    # Hosted runner only: fork PRs on a public repo could run code on a self-hosted one.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -m "not crewai and not langchain and not live"
